[package]
name = "cadence-desktop"
version = "0.1.0"
description = "Cadence Linux desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
# KSNI instead of Tauri's libappindicator: only it reports a left click on the tray icon.
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }
# Linux notifications over D-Bus: the plugin sent no desktop-entry hint, so KDE could not link them to the app.
notify-rust = "=4.18.2"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=2.12.1", features = ["json"] }
uuid = { version = "=1.29.0", features = ["v4"] }
# Wayland global shortcut through the XDG GlobalShortcuts portal; async-io keeps tokio out.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-lite = "=2.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same crate wry uses: the link policy needs WebKit's navigation type, which Tauri does not pass on.
webkit2gtk = { version = "=2.0.2", features = ["v2_6"] }
gtk = "=0.18.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
