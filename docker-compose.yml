services:
  tududi:
    image: ghcr.io/preciselywrong/cadence:latest
    container_name: tududi
    # Requires: cp .env.example .env — see .env.example for all options
    env_file:
      - .env
    volumes:
      - ./tududi_db:/app/db
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      # Projects from TODO.md files (docs/35-todo-md-projects.md): one
      # sub-folder per project, its TODO.md is the task list. Mount a
      # DEDICATED folder, read-write, and set TUDUDI_TODO_ROOT in .env.
      # NEVER mount ~/Dev or any folder that holds secrets (.env files,
      # keys): the container could read all of it. A folder of git clones
      # refreshed by a sidecar or a cron job is the recommended source.
      # - /mnt/user/appdata/cadence-todos:/app/todo-projects
    ports:
      - "3002:3002"
    restart: unless-stopped
