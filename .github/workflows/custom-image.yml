name: Custom Docker image

# Builds this fork's image from main and pushes it to
# ghcr.io/<owner>/tududi, so every merged change lands in the image without
# touching the upstream release pipeline (docker-publish.yml).
#
# Tags: :latest (main), :sha-<short> (every build), :<branch> on a manual run.
# Uses the workflow's own GITHUB_TOKEN; no secret to configure.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tududi" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=custom-amd64
          cache-to: type=gha,scope=custom-amd64,mode=max

      - name: Smoke test the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c \
            "cd /app/backend && node -e \"require('sequelize'); require('sqlite3'); require('express')\""
