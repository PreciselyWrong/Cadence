<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <form id="form" hidden>
            <p id="already" class="already" hidden>
                <span id="already-text"></span>
                <a id="already-open" href="#" target="_blank" rel="noopener" data-i18n="action_open"></a>
            </p>
            <label><span data-i18n="field_task_name"></span><input id="name" /></label>
            <p id="url" class="muted"></p>
            <button id="save" type="submit" data-i18n="action_task"></button>
        </form>
        <section id="projects" hidden>
            <label><span data-i18n="field_project"></span><select id="project"></select></label>
            <div class="row">
                <button id="send-tab" type="button" data-i18n="action_send_tab"></button>
                <button id="send-group" type="button" data-i18n="action_send_group" hidden></button>
                <button id="open-project" type="button" data-i18n="action_open_project"></button>
            </div>
        </section>
        <p id="message" role="status" hidden></p>
        <button id="options" type="button" class="link" data-i18n="action_options"></button>
        <script src="core.js"></script>
        <script src="i18n.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
